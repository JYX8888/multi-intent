apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-intent
  namespace: multi-intent
  labels:
    app.kubernetes.io/name: multi-intent
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multi-intent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multi-intent
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: multi-intent
          image: REPLACE_WITH_YOUR_REGISTRY/multi-intent:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: multi-intent-config
          volumeMounts:
            - name: runtime-config
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: runtime-config
          secret:
            secretName: multi-intent-runtime-config
            items:
              - key: .env
                path: .env
