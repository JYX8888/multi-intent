apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-intent-config
  namespace: multi-intent
  labels:
    app.kubernetes.io/name: multi-intent
data:
  PORT: "3000"
  HOST: "0.0.0.0"
  REQUEST_TIMEOUT_MS: "10000"
  MODEL_TIMEOUT_MS: "8000"
  SHUTDOWN_GRACE_MS: "30000"
  MAX_MODEL_CONCURRENCY: "100"
  MAX_QUEUE_SIZE: "500"
  QUEUE_TIMEOUT_MS: "30000"
